<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>CYBER-VAULT | Ponomarenko & ko</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #e0e0e0;

            margin: 0;
            display: flex;
            justify-content: center;

            overflow: hidden;

            text-transform: uppercase;
        }
        .status-box {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #333;
            font-family: monospace;
            font-size: 0.8em;
            color: #00ff41;
        }
        .modules {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            font-size: 0.7em;
            text-transform: uppercase;
            color: #666;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.6em;
            color: #333;

</head>
<body>
    <div class="container">

</html>
